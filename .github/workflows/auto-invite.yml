name: BCX26 Auto-Invite

on:
  issues:
    types: [opened]

jobs:
  invite_user:
    runs-on: ubuntu-latest
    # Only run this if the issue has the label from our template
    if: contains(github.event.issue.labels.*.name, 'invite-request')
    
    steps:
      - name: Send Organization Invitation
        env:
          # This uses the secret you created in Step 3
          GITHUB_TOKEN: ${{ secrets.ORG_INVITE_TOKEN }}
          ORG_NAME: "Bosch-Connected-Experience-26" 
          USERNAME: ${{ github.actor }}
        run: |
          echo "Inviting $USERNAME to $ORG_NAME..."
          curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/orgs/$ORG_NAME/memberships/$USERNAME" \
            -d '{"role":"direct_member"}'
            
      - name: Comment on Issue
        env:
          # This uses the default bot token to comment
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "👋 Hello @${{ github.actor }}! 
            
            ✅ **Success!** An invitation to join the **Bosch-Connected-Experience-26** organization has been sent to you. 
            
            👉 **Next Step:** Please check your email for the invite, or visit https://github.com/Bosch-Connected-Experience-26 and click the yellow **Join** banner at the top of the page."

      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --reason "completed"
